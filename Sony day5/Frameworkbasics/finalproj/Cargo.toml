

[package]
name = "mini_chain"
version = "0.1.0"
edition = "2021"

[dependencies]
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
axum = "0.6"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
ed25519-dalek = "1.0.1"
rand = { version = "0.7", features = ["std"] }
lazy_static = "1.4"
blake3 = "1.5"
hex = "0.4"
anyhow = "1.0"


