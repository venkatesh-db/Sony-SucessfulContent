[package]
name = "high-throughput-api-pooler-advanced"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = "0.13"
lazy_static = "1.4"
tracing = "0.1"
tokio-retry = "0.3"
anyhow = "1.0.98"
