[package]
name = "actix_npci_project"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
scylla = "0.6"
redis = { version = "0.23", features = ["tokio-comp"] }
rdkafka = { version = "0.34", features = ["tokio"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.10"